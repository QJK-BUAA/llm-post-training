site_name: "LLM Post-Training 与 Agentic RL 研究"
site_description: "系统梳理大语言模型后训练与 Agentic RL 的算法原理、工业实践与前沿方向"
site_author: "JunKun Qiu"
site_url: https://QJK-BUAA.github.io/llm-post-training/

repo_name: "llm-post-training"
repo_url: https://github.com/QJK-BUAA/llm-post-training
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/QJK-BUAA/llm-post-training

nav:
  - 首页: index.md
  - Post-Training 技术报告:
      - 概述: post-training/index.md
      - 1. 算法基础:
          - 1.1 大模型训练全景: post-training/ch1/1.1-training-landscape.md
          - 1.2 RLHF 与 RLVR 两大范式: post-training/ch1/1.2-rlhf-rlvr.md
          - 1.3 DPO — 离线偏好优化: post-training/ch1/1.3-dpo.md
          - 1.4 PPO — 经典策略优化: post-training/ch1/1.4-ppo.md
          - 1.5 GRPO — RLVR 奠基算法: post-training/ch1/1.5-grpo.md
          - 1.6 DAPO — 工业级优化: post-training/ch1/1.6-dapo.md
          - 1.7 VAPO — Value 路线回归: post-training/ch1/1.7-vapo.md
          - 1.8 CISPO — 裁剪 IS 权重: post-training/ch1/1.8-cispo.md
          - 1.9 GSPO — 序列级策略优化: post-training/ch1/1.9-gspo.md
          - 1.10 SAPO — 平滑软门控: post-training/ch1/1.10-sapo.md
          - 1.11 算法公式速查表: post-training/ch1/1.11-cheatsheet.md
          - 1.12 演进逻辑总结: post-training/ch1/1.12-evolution.md
      - 2. 技术报告深度解读:
          - 2.1 DeepSeek: post-training/ch2/2.1-deepseek.md
          - 2.2 Kimi: post-training/ch2/2.2-kimi.md
          - 2.3 Qwen: post-training/ch2/2.3-qwen.md
          - 2.4 MiniMax: post-training/ch2/2.4-minimax.md
          - 2.5 GLM-5: post-training/ch2/2.5-glm.md
          - 2.6 Seed: post-training/ch2/2.6-seed.md
          - 2.7 闭源模型概览: post-training/ch2/2.7-closed-source.md
          - 2.8 跨模型训练经验: post-training/ch2/2.8-cross-model.md
          - 2.9 数据工程专题: post-training/ch2/2.9-data-engineering.md
          - 2.10 基座的 Agentic 能力是怎么训出来的: post-training/ch2/2.10-agentic-training.md
      - 3. 演进路线与趋势展望:
          - 3.1 技术演进与范式变迁: post-training/ch3/3.1-timeline-paradigms.md
          - 3.2 行业共识与核心挑战: post-training/ch3/3.2-challenges-future.md
          - 3.3 个人分析与思考: post-training/ch3/3.3-opinions.md
  - Agentic RL 调研报告:
      - 概述: agentic-rl/index.md
      - 1. 数学底座与四大算法挑战:
          - 1.1 一眼看懂多轮交互闭环: agentic-rl/ch1/1.1-pomdp-trajectory.md
          - 1.2 单轮 GRPO 为什么会翻车: agentic-rl/ch1/1.2-single-turn-failure.md
          - 1.3 中间几十步没分怎么教: agentic-rl/ch1/1.3-reward-design.md
          - 1.4 赢了算哪一步的功劳: agentic-rl/ch1/1.4-credit-assignment.md
          - 1.5 一上来全错怎么破冰: agentic-rl/ch1/1.5-exploration-memory.md
          - 1.6 多轮异步训练怎么防崩盘: agentic-rl/ch1/1.6-stability-convergence.md
      - 2. 五大垂直场景:
          - 2.1 搜索与深度调研: agentic-rl/ch2/2.1-search-research.md
          - 2.2 代码、SWE 与终端: agentic-rl/ch2/2.2-code-swe-terminal.md
          - 2.3 网页与 GUI 电脑操控: agentic-rl/ch2/2.3-web-gui-computer.md
          - 2.4 记忆即动作: agentic-rl/ch2/2.4-memory-context.md
          - 2.5 多智能体协同: agentic-rl/ch2/2.5-multi-agent.md
      - 3. 基础设施、环境与评测:
          - 3.1 开源训练框架对比: agentic-rl/ch3/3.1-frameworks.md
          - 3.2 环境合成与防作弊: agentic-rl/ch3/3.2-environments-anticheat.md
          - 3.3 评测基准全景: agentic-rl/ch3/3.3-benchmarks.md
      - 4. 全景速查与落地:
          - 4.1 全景速查与演进脉络: agentic-rl/ch4/4.1-cheatsheet-timeline.md
          - 4.2 落地决策树与未来: agentic-rl/ch4/4.2-decisions-outlook.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-custom
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mermaid.mjs
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - tags

copyright: 基于公开论文与 <a href="https://github.com/XavierZhang2002/agentic-rl-analysis">agentic-rl-analysis</a> 修订重构
