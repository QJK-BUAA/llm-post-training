site_name: "大模型后训练笔记"
site_description: "按公开技术报告重写的 LLM Post-Training 笔记：算法、工业流水线与趋势"
site_author: "JunKun Qiu"
site_url: https://QJK-BUAA.github.io/llm-post-training/

repo_name: "llm-post-training"
repo_url: https://github.com/QJK-BUAA/llm-post-training
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - 首页: index.md
  - 后训练笔记:
      - 概述: post-training/index.md
      - 1. 算法基础:
          - 1.1 训练全景: post-training/ch1/1.1-training-landscape.md
          - 1.2 RLHF 与 RLVR: post-training/ch1/1.2-rlhf-rlvr.md
          - 1.3 DPO: post-training/ch1/1.3-dpo.md
          - 1.4 PPO: post-training/ch1/1.4-ppo.md
          - 1.5 GRPO: post-training/ch1/1.5-grpo.md
          - 1.6 DAPO: post-training/ch1/1.6-dapo.md
          - 1.7 VAPO: post-training/ch1/1.7-vapo.md
          - 1.8 CISPO: post-training/ch1/1.8-cispo.md
          - 1.9 GSPO: post-training/ch1/1.9-gspo.md
          - 1.10 SAPO: post-training/ch1/1.10-sapo.md
          - 1.11 公式速查: post-training/ch1/1.11-cheatsheet.md
          - 1.12 演进逻辑: post-training/ch1/1.12-evolution.md
      - 2. 技术报告:
          - 2.1 DeepSeek: post-training/ch2/2.1-deepseek.md
          - 2.2 Kimi: post-training/ch2/2.2-kimi.md
          - 2.3 Qwen: post-training/ch2/2.3-qwen.md
          - 2.4 MiniMax: post-training/ch2/2.4-minimax.md
          - 2.5 GLM-5: post-training/ch2/2.5-glm.md
          - 2.6 Seed: post-training/ch2/2.6-seed.md
          - 2.7 闭源模型: post-training/ch2/2.7-closed-source.md
          - 2.8 跨模型经验: post-training/ch2/2.8-cross-model.md
          - 2.9 数据工程: post-training/ch2/2.9-data-engineering.md
          - 2.10 Agentic 能力如何训出: post-training/ch2/2.10-agentic-training.md
      - 3. 趋势:
          - 3.1 范式变迁: post-training/ch3/3.1-timeline-paradigms.md
          - 3.2 共识与挑战: post-training/ch3/3.2-challenges-future.md
          - 3.3 个人判断: post-training/ch3/3.3-opinions.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-custom
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables
  - footnotes

extra_javascript:
  - javascripts/mermaid.mjs
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search

copyright: 内容依据公开论文与 <a href="https://github.com/XavierZhang2002/agentic-rl-analysis">agentic-rl-analysis</a> 重写
